<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/local.css">
<style>
  :root{
    --ink:#1c2024; --ink2:#3b4148; --orange:#e4570f; --orange2:#c2440a; --steel:#2b3138; --paper:#f6f4f0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:var(--W,2000px);height:2000px;overflow:hidden;background:var(--paper)}
  .stage{position:relative;width:var(--W,2000px);height:2000px;overflow:hidden;
    background:
      radial-gradient(ellipse 1450px 1050px at 56% 62%, #fbfaf7 0%, #efece6 55%, #dcd7cf 100%);}
  .hero{position:absolute;left:0;top:0;width:100%;height:100%;transform:translate(var(--hx,0px),var(--hy,0px)) scale(var(--hs,1));transform-origin:50% 50%}
  .clean .txt{display:none}
  .safe{position:absolute;top:0;left:calc((var(--W,2000px) - 2000px)/2);width:2000px;height:2000px}

  /* headline */
  .head{position:absolute;left:84px;top:62px}
  .kicker{font-family:'Oswald';font-weight:600;font-size:66px;letter-spacing:7px;color:var(--orange);line-height:1}
  .kicker .dot{color:var(--ink2);padding:0 14px}
  .title{font-family:'Anton';font-size:184px;line-height:1.02;color:var(--ink);letter-spacing:1px;margin-top:10px;white-space:nowrap}
  .sub{font-family:'Barlow Condensed';font-weight:600;font-size:66px;color:var(--ink2);letter-spacing:1px;margin-top:6px;white-space:nowrap}
  .sub b{color:var(--ink);font-weight:800}
  .sub .bar{display:inline-block;width:5px;height:46px;background:var(--orange);vertical-align:-4px;margin:0 22px}

  /* set of 2 sticker */
  .sticker{position:absolute;right:58px;top:58px;width:380px;height:380px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #f4782f 0%, var(--orange) 45%, var(--orange2) 100%);
    box-shadow:0 18px 40px rgba(60,25,5,.35), inset 0 0 0 12px rgba(255,255,255,.92), inset 0 0 0 20px var(--orange2);
    transform:rotate(9deg);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center}
  .sticker .s1{font-family:'Oswald';font-weight:700;font-size:58px;letter-spacing:5px;line-height:1;margin-top:4px}
  .sticker .s2{font-family:'Anton';font-size:176px;line-height:.98;text-shadow:0 5px 0 rgba(0,0,0,.18)}
  .sticker .s3{font-family:'Oswald';font-weight:700;font-size:58px;letter-spacing:5px;line-height:1;margin-top:-4px}

  /* feature list */
  .feats{position:absolute;right:70px;top:520px;display:flex;flex-direction:column;align-items:flex-end;gap:26px}
  .feat{display:flex;align-items:center;gap:22px;background:rgba(255,255,255,.82);border:3px solid rgba(28,32,36,.10);
    border-radius:18px;padding:16px 30px 16px 22px;box-shadow:0 8px 22px rgba(30,30,30,.10)}
  .feat .ico{width:78px;height:78px;border-radius:50%;background:var(--steel);display:flex;align-items:center;justify-content:center;flex:none}
  .feat .lbl{font-family:'Oswald';font-weight:600;font-size:62px;letter-spacing:2px;color:var(--ink);line-height:1;white-space:nowrap}
  .feat .lbl small{display:block;font-family:'Barlow Condensed';font-weight:600;font-size:34px;letter-spacing:1px;color:var(--ink2);margin-top:6px}
  .flag{width:132px;height:70px;border-radius:6px;box-shadow:0 2px 6px rgba(0,0,0,.25);flex:none;overflow:hidden}

  /* scale badge bottom-left */
  .scale{position:absolute;left:84px;bottom:190px;display:flex;align-items:center;gap:26px}
  .scale .big{font-family:'Anton';font-size:170px;line-height:.9;color:var(--ink)}
  .scale .big span{color:var(--orange)}
  .scale .meta{font-family:'Oswald';font-weight:600;font-size:56px;letter-spacing:3px;line-height:1.08;color:var(--ink)}
  .scale .meta small{display:block;font-family:'Barlow Condensed';font-weight:600;font-size:40px;letter-spacing:1px;color:var(--ink2)}

  /* made in usa stamp */
  .usa{position:absolute;left:78px;bottom:196px;display:flex;align-items:center;gap:30px;background:rgba(255,255,255,.86);
    border-radius:22px;padding:24px 40px 24px 26px;box-shadow:0 10px 30px rgba(30,30,30,.16);border:3px solid rgba(28,32,36,.10)}
  .flagbig{width:228px;height:120px;border-radius:8px;box-shadow:0 3px 10px rgba(0,0,0,.28);flex:none}
  .usat{display:flex;flex-direction:column;line-height:.98}
  .usat .u1{font-family:'Oswald';font-weight:600;font-size:56px;letter-spacing:5px;color:var(--ink2)}
  .usat .u2{font-family:'Anton';font-size:96px;letter-spacing:2px;color:var(--ink)}
  /* bottom band */
  .band{position:absolute;left:0;right:0;bottom:0;height:128px;background:var(--steel);display:flex;align-items:center;justify-content:center;gap:28px;
    border-top:8px solid var(--orange)}
  .band .t{font-family:'Barlow Condensed';font-weight:700;font-size:56px;letter-spacing:3px;color:#fff;white-space:nowrap}
  .band .t em{font-style:normal;color:#ffb68a}
  .band .sep{width:12px;height:12px;border-radius:50%;background:var(--orange)}
</style></head>
<body>
<div class="stage" id="stage">
  <img class="hero" id="hero" src="hero_hq.png">
  <div class="safe">

  <div class="txt head">
    <div class="kicker">HO SCALE<span class="dot">•</span>MODEL RAILROAD</div>
    <div class="title">STEEL MILL LOADS</div>
    <div class="sub"><b>Steel Sheets on Wood Pallets</b><span class="bar"></span>Flat Car Load</div>
  </div>

  <div class="txt sticker"><div class="s1">SET OF</div><div class="s2">2</div><div class="s3">LOADS</div></div>

  <div class="txt feats">
    <div class="feat"><div class="ico"><svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg></div><div class="lbl">HIGH DETAIL</div></div>
    <div class="feat"><div class="ico"><svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg></div><div class="lbl">HIGH QUALITY</div></div>
    <div class="feat"><div class="ico"><svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg></div><div class="lbl">1:87 SCALE</div></div>
  </div>

  <div class="txt usa">
    <svg class="flagbig" viewBox="0 0 190 100" preserveAspectRatio="none">
      <rect width="190" height="100" fill="#fff"/>
      <g fill="#b22234"><rect y="0" width="190" height="7.69"/><rect y="15.38" width="190" height="7.69"/><rect y="30.77" width="190" height="7.69"/><rect y="46.15" width="190" height="7.69"/><rect y="61.54" width="190" height="7.69"/><rect y="76.92" width="190" height="7.69"/><rect y="92.31" width="190" height="7.69"/></g>
      <rect width="76" height="53.85" fill="#3c3b6e"/>
      <g fill="#fff" id="stars"></g>
    </svg>
    <div class="usat"><span class="u1">MADE IN</span><span class="u2">THE USA</span></div>
  </div>

  </div>
  <div class="txt band"><span class="t">LOADS ONLY</span><span class="sep"></span><span class="t"><em>FLAT CAR &amp; TRACK NOT INCLUDED</em></span></div>
</div>
<script>
  // 50 stars, 9 rows alternating 6/5
  const g=document.getElementById('stars'); let k=0;
  for(let r=0;r<9;r++){ const n=r%2?5:6; for(let c=0;c<n;c++){ const x=(r%2? 12.7+c*12.7 : 6.33+c*12.7), y=5.4+r*5.4;
    const s=document.createElementNS('http://www.w3.org/2000/svg','circle'); s.setAttribute('cx',x); s.setAttribute('cy',y); s.setAttribute('r',1.9); g.appendChild(s);} }
  const q=new URLSearchParams(location.search);
  if(q.get('clean')) document.getElementById('stage').classList.add('clean');
  if(q.get('W')) document.documentElement.style.setProperty('--W', q.get('W')+'px');
  if(q.get('hero')) document.getElementById('hero').src=q.get('hero');
  for(const k of ['hx','hy','hs']) if(q.get(k)) document.getElementById('stage').style.setProperty('--'+k, q.get(k)+(k==='hs'?'':'px'));
</script>
</body></html>
