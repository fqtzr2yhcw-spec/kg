# PrusaSlicer profile approximating a Bambu Lab P1S/P2S with a 0.2 mm nozzle at 0.10 mm layers
# (Bambu's 0.10mm Standard @BBL P2S 0.2 nozzle: 0.22 mm lines, 4 walls, 7 top and 5 bottom layers).
# Used only for print-time and filament estimates and to confirm plates slice cleanly.
bed_shape = 0x0,256x0,256x256,0x256
max_print_height = 250
nozzle_diameter = 0.2
filament_diameter = 1.75
filament_density = 1.24
filament_cost = 22
temperature = 220
first_layer_temperature = 220
bed_temperature = 60
first_layer_bed_temperature = 60
first_layer_height = 0.1
layer_height = 0.1
perimeters = 4
top_solid_layers = 7
bottom_solid_layers = 5
fill_density = 15%
fill_pattern = gyroid
top_fill_pattern = monotonic
support_material = 0
skirts = 0
brim_width = 0
gcode_flavor = marlin2
perimeter_generator = arachne
min_feature_size = 25%
external_perimeter_extrusion_width = 0.22
perimeter_extrusion_width = 0.22
infill_extrusion_width = 0.22
solid_infill_extrusion_width = 0.22
top_infill_extrusion_width = 0.22
first_layer_extrusion_width = 0.25
first_layer_speed = 40
perimeter_speed = 150
external_perimeter_speed = 100
small_perimeter_speed = 80
infill_speed = 100
solid_infill_speed = 150
top_solid_infill_speed = 150
gap_fill_speed = 80
bridge_speed = 30
travel_speed = 500
default_acceleration = 10000
perimeter_acceleration = 5000
external_perimeter_acceleration = 5000
infill_acceleration = 10000
travel_acceleration = 10000
first_layer_acceleration = 500
machine_max_acceleration_x = 20000
machine_max_acceleration_y = 20000
machine_max_acceleration_extruding = 20000
machine_max_acceleration_travel = 20000
machine_max_feedrate_x = 500
machine_max_feedrate_y = 500
machine_max_jerk_x = 9
machine_max_jerk_y = 9
retract_length = 0.6
retract_speed = 30
avoid_crossing_perimeters = 0
